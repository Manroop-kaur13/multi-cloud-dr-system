services:
  postgres:
    image: postgres:16-alpine
    container_name: multicloud-dr-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: multicloud-dr-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-5000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DB_MODE: postgres
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      HEALTH_CHECK_INTERVAL_MS: ${HEALTH_CHECK_INTERVAL_MS:-5000}
      FAILURE_THRESHOLD: ${FAILURE_THRESHOLD:-2}
      AUTO_FAILOVER_ENABLED: ${AUTO_FAILOVER_ENABLED:-true}
      RTO_TARGET_SECONDS: ${RTO_TARGET_SECONDS:-15}
      RPO_TARGET_SECONDS: ${RPO_TARGET_SECONDS:-5}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      GCP_REGION: ${GCP_REGION:-us-central1}
    ports:
      - "${PORT:-5000}:5000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: multicloud-dr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pg_data:
